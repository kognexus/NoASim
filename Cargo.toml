[workspace]
resolver = "2"
members = ["crates/nexus-proto", "crates/nexus-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Kognexus"]
repository = "https://github.com/kognexus/KognexusNexus"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
